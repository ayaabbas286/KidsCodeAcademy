<section class="why-us container">
  <h2 class="why-us__title p-4">لماذا نحن ؟</h2>

  @if (ready()) {
    <div class="row g-4">
      @for (card of cards; track card.title; let i = $index) {
        <div class="col-12 col-lg-3 col-md-6">
          <div class="why-us__card card-ui card-border">
            <span class="why-us__icon">{{ card.icon }}</span>
            <h5 class="why-us__card-title">{{ card.title }}</h5>
            <p class="why-us__card-desc">{{ card.description }}</p>
          </div>
        </div>
      }
    </div>
  }
</section>
